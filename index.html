<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Theme</title>
    <style>
        body {
            background: linear-gradient(45deg, #ff77a1, #ff9f68);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: backgroundAnimation 15s linear infinite;
        }
        h1 {
            color: white;
            font-size: 3em;
            text-align: center;
            animation: pulse 1s infinite;
        }
        .button {
            padding: 20px 30px;
            background: #ff1a1a;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
            animation: buttonAnimation 1s infinite;
        }
        @keyframes buttonAnimation {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes backgroundAnimation {
            0% {
                background: linear-gradient(45deg, #ff77a1, #ff9f68);
            }
            50% {
                background: linear-gradient(45deg, #ff9f68, #ff77a1);
            }
            100% {
                background: linear-gradient(45deg, #ff77a1, #ff9f68);
            }
        }
        .heart {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 50px;
            margin: 10px;
            background: red;
            transform: rotate(-45deg);
            animation: float 3s infinite;
        }
        .heart:before,
        .heart:after {
            content: "";
            background: red;
            border-radius: 50%;
            position: absolute;
        }
        .heart:before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 0;
        }
        .heart:after {
            width: 50px;
            height: 50px;
            left: 25px;
            top: 0;
        }
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body>
    <h1>Santhosh 💖 Priyadharshini</h1>
    <button class="button">I LOVE YOU BEDI</button>
    <div class="heart"></div>
    <div class="heart"></div>
    <div class="heart"></div>
</body>
</html>
