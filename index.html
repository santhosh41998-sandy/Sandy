<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced 3D Animations</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }
        .floating {
            position: absolute;
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        .heart {
            position: absolute;
            width: 50px;
            height: 50px;
            background: red;
            clip-path: polygon(50% 0%, 100% 30%, 100% 100%, 50% 70%, 0% 100%, 0% 30%);
            animation: rotate 5s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0); }
            to { transform: rotate(360deg); }
        }
        .glowing-text {
            color: white;
            font-size: 3em;
            text-align: center;
            animation: glow 1.5s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
            to { text-shadow: 0 0 20px rgba(255, 255, 255, 1); }
        }
        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: burst 0.8s ease-out infinite;
        }
        @keyframes burst {
            from { transform: scale(0); }
            to { transform: scale(1); opacity: 0; }
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            box-shadow: 0 0 5px white;
            animation: twinkle 1.5s infinite alternate;
        }
        @keyframes twinkle {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="glowing-text">Welcome to the 3D Animation Showcase!</div>
    <div class="heart floating" style="top: 70%; left: 20%;"></div>
    <div class="heart floating" style="top: 40%; left: 60%;"></div>
    <div class="heart floating" style="top: 20%; left: 80%;"></div>
    <script>
        function createParticles() {
            for (let i = 0; i < 100; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.top = Math.random() * 100 + 'vh';
                document.body.appendChild(particle);
                setTimeout(() => { particle.remove(); }, 800);
            }
        }
        setInterval(createParticles, 500);
    </script>
</body>
</html>
