<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Story</title>
    <style>
        body {
            background: black;
            color: white;
            overflow: hidden;
            position: relative;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            width: 2px;
            height: 2px;
            animation: twinkle 1.5s infinite;
        }
        @keyframes twinkle {
            0%, 20%, 80%, 100% {
                opacity: 0.2;
            }
            10%, 30%, 60% {
                opacity: 1;
            }
        }
        .float {
            position: absolute;
            animation: float 3s infinite;
        }
        @keyframes float {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
            100% {
                transform: translateY(0);
            }
        }
        .heart {
            position: absolute;
            font-size: 24px;
            color: red;
        }
    </style>
</head>
<body>
    <h1>Welcome to the Love Story Page!</h1>
    <button onclick="revealLoveMessage()">Click for Love Message</button>
    <div id="loveMessage" style="display: none;">❤️ You are loved! ❤️</div>

    <script>
        function revealLoveMessage() {
            document.getElementById('loveMessage').style.display = 'block';
        }

        // Generate stars
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.left = Math.random() * 100 + 'vw';
            document.body.appendChild(star);
        }

        // Floating hearts
        for (let i = 0; i < 10; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 5 + 2 + 's';
            heart.style.top = Math.random() * 100 + 10 + 'vh';
            heart.classList.add('float');
            document.body.appendChild(heart);
        }
    </script>
</body>
</html>
